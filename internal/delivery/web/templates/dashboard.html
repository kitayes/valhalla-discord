<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKWATCH // DASHBOARD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #c0c0c0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }

        .header {
            background: #111;
            border-bottom: 1px solid #333;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #e74c3c;
            font-size: 20px;
            letter-spacing: 3px;
        }

        .header h1 span {
            color: #95a5a6;
        }

        .header a {
            color: #e74c3c;
            text-decoration: none;
            font-size: 14px;
        }

        .content {
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
        }

        .card .value {
            font-size: 32px;
            color: #e74c3c;
        }

        .card .label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #111;
            border: 1px solid #333;
        }

        th {
            background: #222;
            padding: 12px 10px;
            text-align: left;
            color: #e74c3c;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 10px;
            border-top: 1px solid #222;
            color: #c0c0c0;
            font-size: 14px;
        }

        tr:hover td {
            background: #1a1a1a;
        }

        .section-title {
            color: #e74c3c;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .license-form {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .license-form input,
        .license-form select {
            background: #000;
            border: 1px solid #333;
            color: #c0c0c0;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            margin-right: 10px;
        }

        .license-form button {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }

        .license-form button.danger {
            background: #333;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>BLACK<span>WATCH</span> // DASHBOARD</h1>
        <a href="/logout">[LOGOUT]</a>
    </div>
    <div class="content">
        <div class="stats">
            <div class="card">
                <div class="value">{{.PlayerCount}}</div>
                <div class="label">Players</div>
            </div>
            <div class="card">
                <div class="value">{{.GuildCount}}</div>
                <div class="label">Guilds</div>
            </div>
            <div class="card">
                <div class="value">{{.MatchCount}}</div>
                <div class="label">Matches</div>
            </div>
            <div class="card">
                <div class="value">24h</div>
                <div class="label">Uptime</div>
            </div>
        </div>

        <div class="section-title">// Top Players</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Matches</th>
                    <th>Wins</th>
                    <th>Losses</th>
                </tr>
            </thead>
            <tbody>
                {{range .TopPlayers}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Name}}</td>
                    <td>{{.Matches}}</td>
                    <td>{{.Wins}}</td>
                    <td>{{.Losses}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>

        <div class="license-form">
            <div class="section-title">// License Management</div>
            <form method="POST" action="/api/license">
                <input type="text" name="guild_id" placeholder="Guild ID" required />
                <select name="action">
                    <option value="upgrade">Upgrade to PRO</option>
                    <option value="expire">Expire License</option>
                </select>
                <input type="number" name="days" placeholder="Days (default 30)" value="30" min="1" max="365" />
                <button type="submit">EXECUTE</button>
            </form>
        </div>
    </div>
</body>

</html>
