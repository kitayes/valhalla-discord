services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackwatch_bots
    restart: always
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_healthy
    env_file:
      - .env
    ports:
      # The admin dashboard. Bound to loopback: it authenticates with a single
      # shared key, so it is meant to sit behind a reverse proxy that terminates
      # TLS, not to be published straight onto the host's interfaces. Without
      # this mapping the dashboard listened inside the container and nothing
      # could reach it.
      - "127.0.0.1:${WEB_ADMIN_PORT:-8080}:${WEB_ADMIN_PORT:-8080}"
    environment:
      - REPO_DB_HOST=db
      - REPO_DB_PORT=5432
      - REPO_DB_USERNAME=postgres
      - REPO_DB_PASSWORD=${REPO_DB_PASSWORD:?REPO_DB_PASSWORD must be set in .env}
      - REPO_DB_NAME=${REPO_DB_NAME:-valhalla_db}
      - REPO_DB_SSLMODE=disable
      - AI_PROVIDER=${AI_PROVIDER:-ocr}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://ocr:8000}

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: blackwatch_ocr
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: ankane/pgvector:latest
    container_name: blackwatch_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${REPO_DB_PASSWORD:?REPO_DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${REPO_DB_NAME:-valhalla_db}
    ports:
      # Bound to loopback: the database was reachable on every interface of the
      # host. The app talks to it over the compose network and does not need this
      # mapping at all — it is here only for local psql access.
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB:-valhalla_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: